name: Build validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate campaign scheduler Worker syntax
        run: node --check workers/campaign-scheduler/index.js
      - name: Validate workspace API syntax
        run: |
          node --check functions/api/workspace/team.js
          node --check functions/api/whatsapp/send.js
          node --check functions/api/workspace/health.js
          node --check functions/api/whatsapp/webhook.js
      - name: Build production bundle
        run: npm run build
